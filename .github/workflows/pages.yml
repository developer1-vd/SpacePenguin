name: pages

# Publishes the project site in docs/ to GitHub Pages whenever it changes on main,
# with the newest release's Flatpak repository under /flatpak/ (the build workflow
# attaches it to the release as flatpak-repo.tar.gz, then starts this one).
# One-time setup: Settings › Pages › Build and deployment › Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one, but a deployment
# already running is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the site
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to publish
      id-token: write   # to prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the site's local links
        run: |
          cd docs
          missing=0
          for ref in $(grep -oE '(src|href|srcset)="[^"#:]+"' index.html | sed -E 's/^[a-z]+="//; s/"$//' | sort -u); do
            [ -e "$ref" ] || { echo "missing: $ref"; missing=1; }
          done
          exit $missing

      - name: Add the Flatpak repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh api "repos/${GH_REPO}/releases?per_page=30" \
                  --jq '[.[] | select(any(.assets[]; .name == "flatpak-repo.tar.gz"))][0].tag_name // empty')
          if [ -z "${tag}" ]; then
            echo "No release has a Flatpak repository yet."
            exit 0
          fi
          gh release download "${tag}" --pattern flatpak-repo.tar.gz --dir "${RUNNER_TEMP}"
          tar xzf "${RUNNER_TEMP}/flatpak-repo.tar.gz" -C docs
          echo "Flatpak repository from ${tag}: $(du -sh docs/flatpak | cut -f1)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
