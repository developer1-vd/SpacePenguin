name: build

# Builds, tests and packages SpacePenguin on Linux, Windows and macOS. A tag such
# as v0.1.0 also publishes the three packages as a GitHub release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'
  QT_MODULES: 'qtwebengine qtwebchannel qtpositioning qtpdf qtserialport'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
          - name: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64
          - name: macOS
            os: macos-14
            qt_arch: clang_64

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build and runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 \
            libxcb-render-util0 libxcb-image0 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libxkbfile1 libasound2t64 libfontconfig1 libdbus-1-3 \
            desktop-file-utils appstream

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -n1)
          echo "Version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate desktop metadata
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate packaging/linux/org.spacepenguin.SpacePenguin.desktop
          appstreamcli validate --no-net build/org.spacepenguin.SpacePenguin.metainfo.xml

      - name: Package AppImage
        if: runner.os == 'Linux'
        env:
          BUILD_DIR: build
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: ./build-appimage.sh "${{ steps.version.outputs.version }}"

      - name: Package DMG
        if: runner.os == 'macOS'
        env:
          BUILD_DIR: build
        run: ./build-dmg.sh "${{ steps.version.outputs.version }}"

      - name: Package installer and zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
            if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) { choco install nsis -y --no-progress }
            $env:PATH = "$nsis;$env:PATH"
          }
          ./build-windows.ps1 -Version "${{ steps.version.outputs.version }}" -BuildDir build

      - name: Smoke-test the installed app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windeployqt must have brought along everything the browser needs.
          foreach ($file in 'SpacePenguin.exe', 'QtWebEngineProcess.exe', 'Qt6WebEngineCore.dll',
                            'qwindows.dll', 'qtwebengine_resources.pak', 'icudtl.dat') {
            $found = Get-ChildItem -Path 'build\dist' -Recurse -Filter $file | Select-Object -First 1
            if (-not $found) { throw "Missing from the install: $file" }
            Write-Host "found $($found.FullName)"
          }

      - name: Smoke-test the installed app (macOS)
        if: runner.os == 'macOS'
        run: |
          app=build/dist/SpacePenguin.app
          test -x "$app/Contents/MacOS/SpacePenguin"
          test -f "$app/Contents/Resources/SpacePenguin.icns"
          test -d "$app/Contents/Frameworks/QtWebEngineCore.framework"
          codesign --verify --deep --strict "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: SpacePenguin-${{ matrix.name }}
          if-no-files-found: error
          path: |
            SpacePenguin-*.AppImage
            SpacePenguin-*.dmg
            SpacePenguin-*-setup.exe
            SpacePenguin-*-windows-x64.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
