<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SpacePenguin</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f6f7f9;
    color: #14161a;
  }
  h1 { font-size: 2rem; margin: 0; letter-spacing: -0.01em; }
  p { margin: 0; max-width: 34rem; text-align: center; opacity: 0.75; }
  ul { list-style: none; display: flex; gap: 0.75rem; padding: 0; margin: 0; flex-wrap: wrap; justify-content: center; }
  a {
    display: inline-block;
    padding: 0.5rem 1rem;
    border: 1px solid rgba(20, 22, 26, 0.25);
    border-radius: 0.5rem;
    text-decoration: none;
    color: inherit;
  }
  a:hover { border-color: rgba(20, 22, 26, 0.6); }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.9em; }
  @media (prefers-color-scheme: dark) {
    body { background: #14161a; color: #f6f7f9; }
    a { border-color: rgba(246, 247, 249, 0.25); }
    a:hover { border-color: rgba(246, 247, 249, 0.6); }
  }
</style>
</head>
<body>
  <h1>SpacePenguin</h1>
  <p>Pre-alpha. Tabs, an address bar that searches when you type words, and a
     deliberately locked-down security posture are in. Everything else is
     still on the way.</p>
  <ul>
    <li><a href="https://example.com">example.com</a></li>
    <li><a href="https://en.wikipedia.org/wiki/Main_Page">Wikipedia</a></li>
    <li><a href="https://news.ycombinator.com">Hacker News</a></li>
  </ul>
  <p>New tab <code>Ctrl+T</code> &middot; Close tab <code>Ctrl+W</code> &middot;
     Focus address bar <code>Ctrl+L</code> &middot; Reload <code>F5</code></p>
</body>
</html>
