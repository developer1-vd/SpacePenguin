<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --card-hover: #eef0f4;
    --text: #1b1e25;
    --muted: #5f6675;
    --line: #e1e4ea;
    --accent: #2f5fe0;
    --mark: #2f5fe0;
    --private: #7c4ddb;
    --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121317;
      --card: #1b1d23;
      --card-hover: #23262d;
      --text: #e9ebf1;
      --muted: #9aa1b1;
      --line: #2a2d35;
      --accent: #82a0ff;
      --private: #b48cff;
      --on-accent: #10142a;
    }
  }
  /* Set by the browser when its theme is not "Follow system". */
  :root.light {
    color-scheme: light;
    --bg: #f6f7f9; --card: #ffffff; --card-hover: #eef0f4; --text: #1b1e25; --muted: #5f6675;
    --line: #e1e4ea; --accent: #2f5fe0; --private: #7c4ddb; --on-accent: #ffffff;
  }
  :root.dark {
    color-scheme: dark;
    --bg: #121317; --card: #1b1d23; --card-hover: #23262d; --text: #e9ebf1; --muted: #9aa1b1;
    --line: #2a2d35; --accent: #82a0ff; --private: #b48cff; --on-accent: #10142a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  main {
    width: 100%;
    max-width: 44rem;
    padding: 14vh 1.5rem 2rem;
    flex: 1;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    margin-bottom: 2rem;
  }
  .brand svg { width: 56px; height: 56px; }
  .brand h1 { font-size: 1.9rem; margin: 0; letter-spacing: -0.02em; font-weight: 700; }

  form {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.3rem 0.35rem 0.3rem 1.1rem;
    transition: border-color 0.15s;
  }
  form:focus-within { border-color: var(--accent); }
  form svg { width: 20px; height: 20px; flex: none; stroke: var(--muted); }
  input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 1.05rem;
    padding: 0.6rem 0;
  }
  button {
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font: 600 0.95rem system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 0.65rem 1.2rem;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }

  .private {
    display: none;
    margin: 1.5rem 0 0;
    padding: 1rem 1.2rem;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
  }
  .private strong { color: var(--private); }
  body.is-private .private { display: block; }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 0.6rem;
    margin-top: 2rem;
  }
  .tile {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.7rem 0.8rem;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    color: inherit;
    text-decoration: none;
    min-width: 0;
    transition: background 0.12s;
  }
  .tile:hover { background: var(--card-hover); }
  .avatar {
    flex: none;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    font-weight: 700;
    color: #fff;
  }
  .label { min-width: 0; }
  .label div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .label .host { font-size: 0.78rem; color: var(--muted); }

  footer {
    padding: 1.5rem;
    color: var(--muted);
    font-size: 0.82rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.4rem 1.2rem;
  }
  kbd {
    font: 0.78rem ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.05rem 0.35rem;
    margin-left: 0.3rem;
  }
</style>
</head>
<body>
  <main>
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <clipPath id="sp-globe"><circle cx="50" cy="72" r="20"/></clipPath>
        <g transform="translate(50 50) scale(.92) translate(-50 -53.25)">
          <path d="M25.5 54V35a24.5 24.5 0 0 1 49 0v19" fill="none" stroke="#ff7a1a" stroke-width="7"/>
          <path d="M32 47V35a18 18 0 0 1 36 0v12h1a14 14 0 0 1 14 14v22a14 14 0 0 1-14 14H31a14 14 0 0 1-14-14V61a14 14 0 0 1 14-14z" fill="#16171d" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"/>
          <path d="M37 47V36a13 13 0 0 1 26 0v11z" fill="#fff"/>
          <circle cx="45" cy="34" r="2.6" fill="#16171d"/>
          <circle cx="55" cy="34" r="2.6" fill="#16171d"/>
          <path d="M47 38.5h6l-3 4z" fill="#ffb21f" stroke="#ffb21f" stroke-width="1.5" stroke-linejoin="round"/>
          <circle cx="50" cy="72" r="20" fill="#6a4fe0"/>
          <path d="M33 64c4-3 10-3 13 0 2 3-1 5-1 8 0 4 4 6 3 10-1 5-6 7-9 5-3-2-2-7-5-10-3-3-6-6-5-9 1-2 2-3 4-4zM56 61c5-1 11 1 13 5 1 3-1 5-4 5-3 1-3 4-2 7 2 4 1 8-3 10-4 1-5-3-6-7-1-5-4-8-4-13 0-4 2-6 6-7z" fill="#2fb7a3" clip-path="url(#sp-globe)"/>
        </g>
      </svg>
      <h1>SpacePenguin</h1>
    </div>

    <form id="search" role="search" autocomplete="off">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/>
      </svg>
      <input id="q" type="search" name="q" placeholder="Search the web or type an address"
             aria-label="Search" autofocus>
      <button type="submit">Search</button>
    </form>

    <p class="private">
      <strong>Private window.</strong> Pages you open here leave no history, cookies or cache
      on this computer once you close every private window. Websites, your network and your
      employer can still see what you do.
    </p>

    <nav class="tiles" id="tiles" aria-label="Most visited"></nav>
  </main>

  <footer id="shortcuts" aria-label="Keyboard shortcuts"></footer>

<script>
(function () {
  "use strict";
  // Filled in by the browser for every request; see StartPageSchemeHandler.
  var data = /*SP_DATA*/null || { search: "https://duckduckgo.com/?q={query}", tiles: [], private: false };

  if (data.private) document.body.classList.add("is-private");

  function looksLikeAddress(text) {
    return /^[a-z][a-z0-9+.-]*:\/\//i.test(text) || /^[^\s\/]+\.[a-z]{2,}(\/\S*)?$/i.test(text);
  }

  document.getElementById("search").addEventListener("submit", function (event) {
    event.preventDefault();
    var text = document.getElementById("q").value.trim();
    if (!text) return;
    if (looksLikeAddress(text)) {
      location.href = /^[a-z][a-z0-9+.-]*:\/\//i.test(text) ? text : "https://" + text;
    } else {
      location.href = data.search.replace("{query}", encodeURIComponent(text));
    }
  });

  var palette = ["#2f5fe8", "#7c4ddb", "#d0428a", "#e0632f", "#1f8a4c", "#0f8fa8", "#b2771a", "#4a5568"];
  function hue(text) {
    var hash = 0;
    for (var i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) | 0;
    return palette[Math.abs(hash) % palette.length];
  }

  var footer = document.getElementById("shortcuts");
  (data.shortcuts || []).forEach(function (shortcut) {
    if (!shortcut.keys) return;
    var item = document.createElement("span");
    item.textContent = shortcut.label;
    var keys = document.createElement("kbd");
    keys.textContent = shortcut.keys;
    item.appendChild(keys);
    footer.appendChild(item);
  });

  var tiles = document.getElementById("tiles");
  (data.tiles || []).slice(0, 8).forEach(function (tile) {
    var url;
    try { url = new URL(tile.url); } catch (e) { return; }
    if (url.protocol !== "https:" && url.protocol !== "http:") return;

    var host = url.hostname.replace(/^www\./, "");
    var link = document.createElement("a");
    link.className = "tile";
    link.href = url.href;
    link.title = tile.title || url.href;

    var avatar = document.createElement("span");
    avatar.className = "avatar";
    avatar.style.background = hue(host);
    avatar.textContent = (host.charAt(0) || "?").toUpperCase();

    var label = document.createElement("span");
    label.className = "label";
    var title = document.createElement("div");
    title.textContent = tile.title || host;
    var hostLine = document.createElement("div");
    hostLine.className = "host";
    hostLine.textContent = host;
    label.appendChild(title);
    label.appendChild(hostLine);

    link.appendChild(avatar);
    link.appendChild(label);
    tiles.appendChild(link);
  });
})();
</script>
</body>
</html>
